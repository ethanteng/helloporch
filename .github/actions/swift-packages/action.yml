name: Swift packages
description: >-
  Restores Porch's Swift packages, including LiveKit's prebuilt frameworks, from the Actions cache, fetches whatever is
  missing with retries, and saves them for later runs. Builds then pass
  `-clonedSourcePackagesDirPath ios/build/packages -disableAutomaticPackageResolution`, so this is the only step that
  downloads packages.

# GitHub's release downloads, where LiveKit's xcframeworks live, sometimes answer 504 for a while. Without a cache every
# job downloaded them again, and one 504 failed the job before anything compiled. The four iOS jobs resolve in parallel,
# so a job that is still retrying looks up the exact cache key again: a sibling may have saved it since the first miss.
runs:
  using: composite
  steps:
    - name: Name the package cache
      id: key
      shell: bash
      run: |
        resolved="$(shasum -a 256 ios/Porch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | cut -c 1-16)"
        xcode="$(xcodebuild -version | awk '/Build version/ { print $3 }')"
        echo "key=swift-packages-$RUNNER_OS-$xcode-$resolved" >> "$GITHUB_OUTPUT"
        echo "prefix=swift-packages-$RUNNER_OS-" >> "$GITHUB_OUTPUT"
    # An older cache is still worth restoring: only what changed is fetched.
    - name: Restore Swift packages
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ios/build/packages
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Fetch missing Swift packages
      id: fetch
      shell: bash
      run: |
        if xcodebuild -resolvePackageDependencies -project ios/Porch.xcodeproj -scheme Porch \
          -clonedSourcePackagesDirPath ios/build/packages; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Fetching Swift packages failed (attempt 1 of 3). Checking whether a parallel job saved them."
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi
    # Exact key only. A prefix match would replace a partial download with an older tree.
    # Skip this lookup when the first restore was already an exact hit: the retries below then re-download,
    # which is what a bad cache needs. This lookup is for a miss that a parallel job has since filled.
    - name: Restore Swift packages a parallel job saved
      id: restore_again
      if: steps.fetch.outputs.ok != 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ios/build/packages
        key: ${{ steps.key.outputs.key }}
    - name: Fetch Swift packages again
      id: fetch_again
      if: steps.fetch.outputs.ok != 'true' && steps.restore_again.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "::warning::Swift packages are not in the cache yet. Trying again in 30 seconds (attempt 2 of 3)."
        sleep 30
        if xcodebuild -resolvePackageDependencies -project ios/Porch.xcodeproj -scheme Porch \
          -clonedSourcePackagesDirPath ios/build/packages; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore Swift packages a parallel job saved before the last try
      id: restore_last
      if: steps.fetch_again.outputs.ok == 'false' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ios/build/packages
        key: ${{ steps.key.outputs.key }}
    - name: Fetch Swift packages a last time
      if: steps.fetch_again.outputs.ok == 'false' && steps.restore_last.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "::warning::Swift packages are not in the cache yet. Trying again in 60 seconds (attempt 3 of 3)."
        sleep 60
        xcodebuild -resolvePackageDependencies -project ios/Porch.xcodeproj -scheme Porch \
          -clonedSourcePackagesDirPath ios/build/packages
    # Saved now rather than at the end of the job, so a later test failure still leaves the packages for the next run.
    # Parallel jobs race to save the same key; the ones that lose only log a warning.
    - name: Save Swift packages
      if: steps.restore.outputs.cache-hit != 'true' && steps.restore_again.outputs.cache-hit != 'true' && steps.restore_last.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ios/build/packages
        key: ${{ steps.key.outputs.key }}
