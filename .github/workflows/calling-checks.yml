name: Calling server checks

on:
  push:
    paths: ['app/**', 'lib/calls/**', 'scripts/**', 'tests/**', 'package*.json', 'tsconfig.json', '.github/workflows/calling-checks.yml']
  pull_request:
    paths: ['app/**', 'lib/calls/**', 'scripts/**', 'tests/**', 'package*.json', 'tsconfig.json', '.github/workflows/calling-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check scripts/check-calling.mjs
      - run: npm run typecheck
      - run: npm run build
