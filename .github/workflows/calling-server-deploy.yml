name: Deploy calling server

on:
  push:
    branches: [main]
    paths: ['app/api/**', 'lib/**', 'scripts/verify-calling-deployment.mjs', 'package*.json', 'next.config.ts', 'tsconfig.json', '.vercelignore', '.github/workflows/calling-server-deploy.yml']
  workflow_dispatch:
  workflow_call:
    secrets:
      VERCEL_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: porch-calling-server-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: calling-server-production
    env:
      VERCEL_ORG_ID: team_xLXDpIOs1pK3jkr6PExoAET8
      VERCEL_PROJECT_ID: prj_1m03AHibL90MRxlExgzujzYlSix6
      CALLING_SERVER_ORIGIN: https://porch-calling-prototype.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Set VERCEL_TOKEN in the calling-server-production environment.'; exit 1; }
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@64.5.0
      - name: Load calling project production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID"
      - name: Verify the linked project
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const project = JSON.parse(readFileSync('.vercel/project.json', 'utf8'));
          if (project.orgId !== process.env.VERCEL_ORG_ID || project.projectId !== process.env.VERCEL_PROJECT_ID || project.projectName !== 'porch-calling-prototype') {
            throw new Error('The configured project must be porch-calling-prototype in the calling-server team.');
          }
          JS
      - name: Build the production server
        run: vercel build --prod
      - name: Stage a production deployment
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --yes --env "PORCH_DEPLOYMENT_COMMIT=$GITHUB_SHA")"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module <<'JS'
          const value = process.env.DEPLOYMENT_URL;
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.origin !== value || !url.hostname.endsWith('.vercel.app')) throw new Error('Invalid deployment URL.');
          JS
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify staged server configuration and commit
        env:
          CALLING_DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          CALLING_DEPLOYMENT_COMMIT: ${{ github.sha }}
          CALLING_VERIFY_WITH_VERCEL_CLI: '1'
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/verify-calling-deployment.mjs
      - name: Promote the verified production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --scope "$VERCEL_ORG_ID"
      - name: Verify the app's calling-server address
        env:
          CALLING_DEPLOYMENT_URL: ${{ env.CALLING_SERVER_ORIGIN }}
          CALLING_DEPLOYMENT_COMMIT: ${{ github.sha }}
        run: node scripts/verify-calling-deployment.mjs
      - name: Record release
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          printf 'Calling server deployed and verified at %s\n\nCommit: %s\n\nDeployment: %s\n' "$CALLING_SERVER_ORIGIN" "$GITHUB_SHA" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove pulled secrets and build output
        if: always()
        run: rm -rf .vercel
