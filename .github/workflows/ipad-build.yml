name: iPhone and iPad build

on:
  push:
    paths: ['ios/**', '.github/workflows/ipad-build.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ipad-build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipad-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode
        run: xcodebuild -version
      - name: Test contact validation and keypad handling
        run: swift test --package-path ios/PorchCore
      - name: Test Cell2Jack protocol and preview boundary
        run: |
          bash ios/scripts/test-cell2jack.sh
          python3 ios/scripts/check-keypad-preview.py
      # DriverKit extensions cannot run in Simulator and require development
      # certificates. Keep the app/tests ad-hoc signed, but do not sign the
      # driver-only SDK dependency on this certificate-free CI runner.
      - name: Build universal simulator app
        run: >-
          xcodebuild -project ios/Porch.xcodeproj -scheme Porch
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build/simulator CODE_SIGNING_ALLOWED=YES 'CODE_SIGNING_ALLOWED[sdk=driverkit*]=NO' CODE_SIGN_IDENTITY=- build
      - name: Build release app for iPhone and iPad
        run: >-
          xcodebuild -project ios/Porch.xcodeproj -scheme Porch
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath ios/build/device CODE_SIGNING_ALLOWED=NO build
      - name: Test caregiver keyboard and focus on an iPad simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPad" in d["name"]))')"
          echo "PORCH_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project ios/Porch.xcodeproj -scheme Porch -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath ios/build/simulator \
            -parallel-testing-enabled NO ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES 'CODE_SIGNING_ALLOWED[sdk=driverkit*]=NO' CODE_SIGN_IDENTITY=- test
      - name: Launch on an iPad simulator and capture the screens
        timeout-minutes: 10
        shell: bash
        run: |
          device_id="$PORCH_SIMULATOR_ID"
          xcrun simctl install "$device_id" ios/build/simulator/Build/Products/Debug-iphonesimulator/Porch.app
          mkdir -p ios/build/screenshots
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/clock.png
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/dynamic-day.png --preview-dynamic --preview-hour 10
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/dynamic-dawn.png --preview-dynamic --preview-hour 6
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/dynamic-sunset.png --preview-dynamic --preview-hour 17
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/dynamic-night.png --preview-dynamic --preview-hour 22
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/caregiver.png --preview-six --preview-caregiver
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/pin-setup.png --preview-pin-setup
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/people.png --preview-six --preview-people
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/people-chinese.png --preview-six --preview-people --preview-chinese --family-silent
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/clock-chinese.png --preview-chinese --family-silent
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/dynamic-chinese.png --preview-dynamic --preview-chinese --preview-hour 10 --family-silent
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/keyboard.png --preview-phone-setup --preview-touch-keyboard
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/native-keyboard.png --preview-phone-setup --preview-system-keyboard --preview-hardware-keyboard
      - name: Save the iPad screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Porch-iPad-screenshots
          path: ios/build/screenshots/*.png
          retention-days: 7
      - name: Test layouts and keyboard on an iPhone simulator
        shell: bash
        run: |
          xcrun simctl shutdown "$PORCH_SIMULATOR_ID"
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))')"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project ios/Porch.xcodeproj -scheme Porch -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath ios/build/simulator \
            -parallel-testing-enabled NO ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES 'CODE_SIGNING_ALLOWED[sdk=driverkit*]=NO' CODE_SIGN_IDENTITY=- test
          bash ios/scripts/capture-preview.sh "$device_id" ios/build/screenshots/family-iphone.png
      - name: Save the iPhone screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Porch-iPhone-screenshot
          path: ios/build/screenshots/family-iphone.png
          retention-days: 7
      - name: Save simulator app for local testing
        uses: actions/upload-artifact@v4
        with:
          name: Porch-simulator
          path: ios/build/simulator/Build/Products/Debug-iphonesimulator/Porch.app
          retention-days: 7
