name: Upload Porch to Google Play

# Builds Porch for Android and puts it on Google Play's internal testing track, where pilot families install it
# (android/README.md, "Release to Google Play"). Like the TestFlight workflow, it only checks by default, and it deploys
# the calling server first when it uploads. android/scripts/release.sh does the work, and runs the same way locally.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: What testers see as "What's new" in Google Play
        type: string
        default: Fixes and improvements.
      version_name:
        description: The version people see, such as 0.3. Left empty, it's 0 and the build number.
        type: string
        default: ''
      verify_only:
        description: Build, sign and have Google Play check the bundle without uploading it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: porch-google-play
  cancel-in-progress: false

jobs:
  calling-server:
    if: ${{ !inputs.verify_only }}
    uses: ./.github/workflows/calling-server-deploy.yml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  upload:
    if: ${{ !cancelled() && (inputs.verify_only || needs.calling-server.result == 'success') }}
    needs: calling-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play
    defaults:
      run:
        working-directory: android
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Put the signing key and Firebase settings in place
        run: |
          umask 077
          for name in PLAY_SERVICE_ACCOUNT_JSON ANDROID_UPLOAD_KEYSTORE ANDROID_UPLOAD_PASSWORD ANDROID_GOOGLE_SERVICES_JSON; do
            if [[ -z "${!name}" ]]; then echo "Missing Google Play configuration: $name" >&2; exit 1; fi
          done
          mkdir -p "$RUNNER_TEMP/porch-android"
          echo "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/porch-android/upload.jks"
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$ANDROID_UPLOAD_PASSWORD" "$ANDROID_UPLOAD_PASSWORD" \
            > "$RUNNER_TEMP/porch-android/upload.properties"
          echo "$ANDROID_GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
      - name: Build, sign and upload
        env:
          PORCH_ANDROID_UPLOAD: ${{ runner.temp }}/porch-android/upload.properties
        run: |
          options=(--notes "$RELEASE_NOTES")
          if [[ -n "$VERSION_NAME" ]]; then options+=(--version-name "$VERSION_NAME"); fi
          if [[ "$VERIFY_ONLY" == true ]]; then options+=(--verify-only); fi
          scripts/release.sh "${options[@]}"
      - name: Clean up signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/porch-android" app/google-services.json
